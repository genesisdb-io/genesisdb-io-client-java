name: Release

# Triggered by hand. Publishes the version in pom.xml to Maven Central and tags it.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - run: mvn -B test
      - name: Tag
        run: |
          version="$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"
          # A rerun after a failed deploy finds the tag of the first attempt. Reuse it only
          # when it points to the commit being released, never move an existing tag.
          existing="$(git ls-remote --tags origin "refs/tags/v$version^{}" | cut -f1)"
          if [ -n "$existing" ]; then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "v$version already tags $existing, not $GITHUB_SHA" >&2
              exit 1
            fi
            echo "v$version already tags this commit, reusing it"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "v$version"
          git push origin "v$version"
      - run: mvn -B -P release -DskipTests deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
